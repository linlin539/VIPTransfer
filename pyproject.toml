[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmware-vip-transfer"
version = "0.1.0"
description = "Zero-IP file transfer between Windows host and VMware Ubuntu guest via VIX SDK"
requires-python = ">=3.11"

[project.scripts]
vip-transfer = "src.main:main"

[tool.setuptools.packages.find]
where = ["src"]
